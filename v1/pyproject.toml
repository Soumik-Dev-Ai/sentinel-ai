[project]
name = "self-correcting-agent"
version = "0.1.0"
description = "Self-Correcting Multi-Step Agent — Heva AI Assignment 2"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["backend/"]
exclude = ["backend/tests/", "backend/scripts/", "backend/eval/"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers -q"
markers = ["e2e: end-to-end tests requiring real LLM API keys (skipped by default)"]
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/__init__.py",
    "backend/tests/*",
    "backend/eval/*",
    "backend/scripts/*",
]

[tool.coverage.report]
fail_under = 85