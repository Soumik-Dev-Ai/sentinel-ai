repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy --strict src
        entry: mypy
        args: [--strict, src]
        language: python
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
        additional_dependencies: [mypy>=1.10]
      - id: pytest-gate
        name: pytest smoke check
        entry: pytest
        args: [-q, --ignore=tests/e2e]
        language: python
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
        additional_dependencies: [pytest>=8.2]